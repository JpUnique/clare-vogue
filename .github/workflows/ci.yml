name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.changes.outputs.backend }}${{ steps.changes.outputs.frontend }}${{ steps.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: |
          # Fetch origin/main if it doesn't exist (for forks/first run)
          git fetch origin main 2>/dev/null || true

          # Default to all true if this is first commit or origin/main unavailable
          BASE_REF="origin/main"
          if ! git rev-parse "$BASE_REF" >/dev/null 2>&1; then
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
            echo "packages=true" >> $GITHUB_OUTPUT
          else
            if git diff "$BASE_REF" --name-only | grep -E '^(apps/backend|packages)/' >/dev/null; then
              echo "backend=true" >> $GITHUB_OUTPUT
            fi
            if git diff "$BASE_REF" --name-only | grep -E '^apps/frontend/' >/dev/null; then
              echo "frontend=true" >> $GITHUB_OUTPUT
            fi
            if git diff "$BASE_REF" --name-only | grep -E '^packages/' >/dev/null; then
              echo "packages=true" >> $GITHUB_OUTPUT
            fi
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clare_vogue_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/clare_vogue_test
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_PUBLISHABLE_KEY: test-key
          SUPABASE_SECRET_KEY: test-secret

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build frontend
        run: npm run build --workspace @clare-vogue/frontend

      - name: Build backend
        run: npm run build --workspace @clare-vogue/backend

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
