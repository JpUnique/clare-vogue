apiVersion: apps/v1
kind: Deployment
metadata:
  name: clare-vogue-frontend
  namespace: clare-vogue
  labels:
    app: clare-vogue-frontend
    component: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: clare-vogue-frontend
  template:
    metadata:
      labels:
        app: clare-vogue-frontend
        component: web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        fsReadOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault

      serviceAccountName: clare-vogue-frontend

      containers:
      - name: frontend
        image: ghcr.io/jpunique/clare-vogue-frontend:latest
        imagePullPolicy: IfNotPresent

        ports:
        - name: http
          containerPort: 3001
          protocol: TCP

        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: BACKEND_PUBLIC_URL
          valueFrom:
            configMapKeyRef:
              name: clare-vogue-config
              key: BACKEND_PUBLIC_URL

        # Secrets from .env
        envFrom:
        - secretRef:
            name: clare-vogue-env

        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "300m"

        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        startupProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30

        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-tmp
          mountPath: /var/tmp

      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi
      - name: var-tmp
        emptyDir:
          sizeLimit: 100Mi

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - clare-vogue-frontend
              topologyKey: kubernetes.io/hostname

      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: clare-vogue-frontend
  namespace: clare-vogue
  labels:
    app: clare-vogue-frontend
spec:
  type: ClusterIP
  selector:
    app: clare-vogue-frontend
  ports:
  - name: http
    port: 3001
    targetPort: http
    protocol: TCP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clare-vogue-frontend
  namespace: clare-vogue
